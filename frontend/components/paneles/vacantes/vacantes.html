<!-- NAVBAR -->
<app-navbar></app-navbar>

<div class="panel-container">
    <!-- BREADCRUMB -->
    <div class="breadcrumb-bar">
        <span class="breadcrumb-path">MENÚ PRINCIPAL / PANELES / VACANTES</span>
    </div>

    <!-- ENCABEZADO -->
    <header class="panel-header">
        <h1>Listado de vacantes</h1>

        <div class="header-actions">
            <button id="btn-refresh" class="btn-icon" title="Recargar" type="button">
                <i class="bi bi-arrow-counterclockwise"></i>
            </button>
        </div>
    </header>

    <!-- TABLA PRINCIPAL -->
    <section class="card-table panel-main-card">
        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Vacante</th>
                        <th>Descripción</th>
                        <th class="text-center">Requisitos</th>
                        <th>Inicio</th>
                        <th>Fin</th>
                        <th>Estado</th>
                        <th>Cátedra</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>

                <tbody id="tb-vacantes">
                    <tr>
                        <td colspan="8" class="text-center">Cargando vacantes...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- PAGINACIÓN -->
        <div class="table-footer">
            <div class="pagination-info" id="vacantes-page-info">0 - 0 de 0</div>

            <div class="pagination-buttons">
                <button id="vacantes-prev" aria-label="Página anterior" class="pagination-btn" type="button" disabled>
                    <i class="bi bi-chevron-left"></i>
                </button>

                <span id="vacantes-page-number">Página 1</span>

                <button id="vacantes-next" aria-label="Página siguiente" class="pagination-btn" type="button" disabled>
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </section>
</div>

<!-- FOOTER -->
<app-footer></app-footer>
