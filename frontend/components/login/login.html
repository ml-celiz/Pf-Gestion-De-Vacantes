<div class="app-viewport d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <app-navbar data-public="true"></app-navbar>

    <div class="app-workspace d-flex flex-grow-1">

        <main class="app-main-content flex-grow-1 d-flex align-items-center justify-content-center p-3 p-md-5">

            <div class="login-card-container">

                <header class="text-center mb-4">
                    <h1 class="h3 fw-extrabold tracking-tight mb-2">
                        ¡Bienvenido!
                    </h1>

                    <p class="text-muted fs-6">
                        Ingresa tus credenciales para acceder
                    </p>
                </header>

                <section class="card login-card border-0">

                    <div class="card-body p-4 p-sm-5">

                        <div
                            id="alert-container"
                            aria-live="polite"
                            aria-atomic="true">
                        </div>

                        <form id="login-form" novalidate>

                            <!-- Correo / Usuario -->
                            <div class="form-group mb-4">

                                <label
                                    for="email"
                                    class="form-label fw-semibold mb-2">
                                    Correo Electrónico o Usuario
                                </label>

                                <div class="input-group-custom">

                                    <i
                                        class="bi bi-person input-icon"
                                        aria-hidden="true">
                                    </i>

                                    <input
                                        type="email"
                                        class="form-control form-control-custom"
                                        id="email"
                                        name="email"
                                        autocomplete="email"
                                        placeholder="usuario@utn.edu.ar"
                                        required
                                        aria-describedby="email-help"
                                    >

                                </div>

                                <div
                                    id="email-help"
                                    class="form-text visually-hidden-sr">
                                    Ingrese su usuario o correo institucional.
                                </div>

                                <div
                                    id="email-error"
                                    class="invalid-feedback">
                                    Por favor, ingrese un correo válido.
                                </div>

                            </div>

                            <!-- Contraseña -->
                            <div class="form-group mb-4">

                                <div class="d-flex justify-content-between align-items-center mb-2">

                                    <label
                                        for="contrasenea"
                                        class="form-label fw-semibold mb-0">
                                        Contraseña
                                    </label>

                                    <!-- 
                                    <a
                                        href="#recuperar"
                                        class="link-forgot text-decoration-none fw-medium fs-7">
                                        ¿Olvidaste tu contraseña?
                                    </a>
                                    -->

                                </div>

                                <div class="input-group-custom">

                                    <i
                                        class="bi bi-lock input-icon"
                                        aria-hidden="true">
                                    </i>

                                    <input
                                        type="password"
                                        class="form-control form-control-custom"
                                        id="contrasenea"
                                        name="contrasenea"
                                        autocomplete="current-password"
                                        placeholder="••••••••"
                                        required
                                        aria-describedby="password-error"
                                    >

                                </div>

                                <div
                                    id="password-error"
                                    class="invalid-feedback">
                                    La contraseña es obligatoria.
                                </div>

                            </div>

                            <!-- Botón -->
                            <button
                                type="submit"
                                id="btn-submit"
                                class="btn btn-primary-custom w-100 fw-bold text-uppercase mt-2">

                                <span id="btn-text">
                                    Iniciar Sesión
                                </span>

                                <span
                                    id="btn-spinner"
                                    class="spinner-border spinner-border-sm ms-2 d-none"
                                    role="status"
                                    aria-hidden="true">
                                </span>

                            </button>

                        </form>

                    </div>

                </section>

            </div>

        </main>

    </div>

    <!--FOOTER -->
    <app-footer></app-footer>

</div>
