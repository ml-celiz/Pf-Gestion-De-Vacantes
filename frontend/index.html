<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gestión de Vacantes - UTN FRRO</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >
    <!-- Google Fonts (preconnect: la fuente llega antes y la letra no "salta") -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <!-- CSS global -->
    <link rel="stylesheet" href="assets/css/global.css?v=2">
</head>

<body>
    <!-- CARGA INICIAL: se ve hasta saber si hay sesión guardada -->
    <div class="app-loader" id="app-loader" role="status" aria-label="Cargando">
        <div class="spinner-border"></div>
    </div>

    <!-- LOGIN (se muestra recién si no hay sesión válida) -->
    <div id="login-view" style="display: none;">
        <app-login></app-login>
    </div>

    <!-- MENU -->
    <div id="menu-view" style="display: none;">
        <app-menu></app-menu>
    </div>

    <!-- LISTADO DE VACANTES -->
    <div id="vacantes-view" style="display: none;"></div>

    <!-- POSTULACIONES -->
    <div id="postulaciones-view" style="display: none;"></div>

    <!-- GESTIÓN DE VACANTES -->
    <div id="gestion-vacantes-view" style="display: none;"></div>

    <!-- ROLES -->
    <div id="roles-view" style="display: none;"></div>

    <!-- USUARIOS -->
    <div id="usuarios-view" style="display: none;"></div>

    <!-- PÁGINA NO ENCONTRADA (404) -->
    <div id="no-encontrada-view" style="display: none;"></div>

    <!-- Mi perfil y Preguntas frecuentes son dialogs: los abre el navbar -->

    <!-- MENÚ LATERAL: uno solo para toda la app; lo abre el botón ☰ del navbar -->
    <app-sidebar></app-sidebar>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Servicios -->
    <script src="services/config.js"></script>
    <script src="services/estilos.js"></script>
    <script src="services/api.js"></script>
    <script src="services/auth.service.js"></script>
    <script src="services/validaciones.js"></script>

    <!-- Componentes -->
    <script type="module" src="components/navbar/navbar.js"></script>
    <script type="module" src="components/login/login.js"></script>
    <script type="module" src="components/menu/menu.js"></script>
    <script type="module" src="components/footer/footer.js"></script>
    <script type="module" src="components/sidebar/sidebar.js"></script>
    <script type="module" src="components/datepicker/datepicker.js"></script>
    <script type="module" src="components/usuarios/roles/roles.js"></script>
    <script type="module" src="components/usuarios/usuarios/usuarios.js"></script>
    <script type="module" src="components/configuraciones/gestion-vacantes/gestion-vacantes.js"></script>
    <script type="module" src="components/paneles/vacantes/vacantes.js"></script>
    <script type="module" src="components/paneles/postulaciones/postulaciones.js"></script>
    <script type="module" src="components/perfil/perfil.js"></script>
    <script type="module" src="components/faq/faq.js"></script>
    <script type="module" src="components/no-encontrada/no-encontrada.js"></script>

    <!-- Navegación entre vistas y restauración de la sesión -->
    <script src="services/navegacion.js"></script>
</body>
</html>
